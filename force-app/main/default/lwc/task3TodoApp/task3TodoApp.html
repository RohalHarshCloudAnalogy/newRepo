<template>
    <lightning-card title="ToDo App" icon-name="standard:task">

        <div class="slds-p-around_medium">
            <lightning-input
            label="New Task"
            placeholder="Enter task"
            value={taskName}
            onchange={handleInputChange}>

            </lightning-input>

            <lightning-button variant="brand" label="Add Task" onclick={addTask} class="slds-m-top_small"></lightning-button>

            <template if:true={tasks.length}>
                <ul class="slds-m-top_medium">
                    <template for:each={tasks} for:item="task">
                        <li key={task.id} class="slds-p-vertical_x-small">
                        
                            <lightning-input type="checkbox" checked={task.completed} onchange={toggleTask} data-id={task.id} label={task.name}> </lightning-input>

                            <lightning-button-icon icon-name="utility:delete" alternative-text="Delete" onclick={deleteTask} data-id={task.id} class="slds-m-left_small"></lightning-button-icon>
                        
                        </li>
                    </template>
                </ul>
            </template>
            <template if:false={tasks.length}>
                <p class="slds-p-top_medium">No tasks added yet.</p>
            </template>

        </div>
    </lightning-card>
</template>
