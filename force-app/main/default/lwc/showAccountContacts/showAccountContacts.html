<template>
    <lightning-card title={title}>


        <lightning-button-icon icon-name="utility:adduser" alternative-text="Add Contact" class="slds-m-left_xx-small"
            title="Add user" variant="brand" onclick={handleAddContactClick}></lightning-button-icon>


        <template if:true={selectedAccount}>
            <b class="slds-box slds-m-around_small">No Account Selected</b>
        </template>

        <template if:false={selectedAccount}>
            <template if:true={hasContacts}>



                <lightning-datatable key-field="Id" columns={columns} data={data}
                    hide-checkbox-column="true"></lightning-datatable>

                <template for:each={data} for:item="record">
                    <lightning-layout key={record.Id} class="slds-box slds-m-around_small">
                        <lightning-layout-item size="8px">
                            <b>{record.LastName}</b>
                        </lightning-layout-item>

                        <lightning-layout-item size="4px">
                            <lightning-button-icon icon-name="utility:edit" onclick={handleEditClick}
                                alternative-text="Edit" class="slds-m-right_xx-small" title="Edit"
                                variant="brand"></lightning-button-icon>
                            <lightning-button-icon icon-name="utility:delete" alternative-text="Delete"
                                class="slds-m-right_xx-small" title="Delete" variant="brand" onclick={handleDeleteClick}></lightning-button-icon>


                        </lightning-layout-item>
                    </lightning-layout>
                </template>
            </template>

            <template if:false={hasContacts}>
                <h1>No Contacts Found</h1>
            </template>
        </template>


        <template if:true={addContact}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium"
                aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close">
                            <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true">
                            </svg>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Add Contacts</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                        <lightning-record-edit-form object-api-name="Contact" record-id={recordId} onsuccess={handleSuccess}>
                            <lightning-input-field field-name="Name"> </lightning-input-field>
                            <lightning-input-field field-name="AccountId" value={accIdFromPub}> </lightning-input-field>
                            <div class="slds-var-m-top_medium">
                                <lightning-button variant="brand" type="submit" label="Save">
                                </lightning-button>
                            </div>
                        </lightning-record-edit-form>
                    </div>
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={handleCancelClick}>Cancel</button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>

        </template>


        <template if:true={editContact}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium"
                aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close">
                            <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true">
                            </svg>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="modal-heading-02" class="slds-modal__title slds-hyphenate">Edit Contacts</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-2">
                        <lightning-record-edit-form object-api-name="Contact" record-id={recordId} onsuccess={handleEditSuccess}>
                            <lightning-input-field field-name="Name" > </lightning-input-field>
                            <lightning-input-field field-name="AccountId" value={accIdFromPub}> </lightning-input-field>
                            <div class="slds-var-m-top_medium">
                                <lightning-button variant="brand" type="submit" label="Save">
                                </lightning-button> 
                            </div>
                        </lightning-record-edit-form>
                    </div>
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={handleEditSuccess}>Cancel</button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>

        </template>


    </lightning-card>
</template>
