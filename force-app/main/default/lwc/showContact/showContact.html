<template>
    <template if:true={contacts}>
        <lightning-card title="Related Contacts">
            <lightning-datatable
                key-field="Id"
                data={contacts}
                columns={columns}
            >

            </lightning-datatable>
        </lightning-card>
    </template>

    <template if:true={error}>
        <p>{error}</p>
    </template>
</template>
