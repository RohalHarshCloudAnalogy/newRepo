<template>
    <lightning-card title="Account Manager" icon-name="standard:account">
        <lightning-datatable
            key-field="Id"
            data={accounts}
            columns={columns}
            onrowselection={handleRowSelection}
            max-row-selection="5">
        </lightning-datatable>

        <div class="slds-m-top_medium">
            <lightning-button
                label="Delete Selected Accounts"
                onclick={handleClick}
                variant="destructive"
                disabled={isDeleteDisabled}>
            </lightning-button>
        </div>
    </lightning-card>
</template>
