<template>
    <lightning-card title="Create New Case" icon-name="standard:case">
        <div class="slds-p-around_medium">
            <lightning-input 
                required
                label="Subject" 
                value={subject} 
                onchange={handleSubjectChange}>
            </lightning-input>

            <lightning-textarea 
                required
                label="Description" 
                value={description} 
                onchange={handleDescriptionChange}
                class="slds-m-top_medium">
            </lightning-textarea>

            <lightning-combobox 
                required
                label="Priority" 
                value={priorityVal} 
                options={priorityOptions} 
                onchange={handlePriorityChange}
                class="slds-m-top_medium">
            </lightning-combobox>

            <lightning-combobox 
                required
                label="Status" 
                value={statusVal} 
                options={statusOptions} 
                onchange={handleStatusChange}
                class="slds-m-top_medium">
            </lightning-combobox>

            <lightning-combobox 
                required
                label="Contact" 
                value={contVal} 
                options={contactOptions} 
                onchange={handleContactChange}
                class="slds-m-top_medium">
            </lightning-combobox>

            <div class="slds-m-top_medium">
                <lightning-button 
                    label="Create Case" 
                    variant="brand" 
                    onclick={handleSubmit}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
